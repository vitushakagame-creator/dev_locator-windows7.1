services:
  - type: web
    name: devspace-community
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: devspace-data
      mountPath: /var/data
      sizeGB: 1
